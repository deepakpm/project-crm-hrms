name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ledgerly
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ALEMBIC_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/ledgerly
      DATABASE_URL: postgresql+psycopg://ledgerly_app:ledgerly_app_dev_password@localhost:5432/ledgerly
      JWT_SECRET: ci-only-secret-not-for-production-use-0123456789
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: psql "postgresql://postgres:postgres@localhost:5432/ledgerly" -f docker/init-app-role.sql
        env:
          PGPASSWORD: postgres
      - run: alembic upgrade head
      - run: ruff check .
      - run: mypy app
      - run: pytest
